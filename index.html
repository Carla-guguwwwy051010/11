<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云币自助充值 · 交互演示</title><style>
:root{--teal:#00aca3;--ink:#092b4b;--line:#dfe4ec;--muted:#748397}*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:var(--ink);font:16px 'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:white;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px 20px}button:hover{border-color:var(--teal);color:var(--teal)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover{background:#009c94;color:white}.demo{background:#16354c;color:#fff;padding:13px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.demo span{font-size:13px;color:#ccdae5}.demo button{font-size:14px;padding:7px 17px;background:transparent;color:#c6d4de;border-color:#53697a}.demo button.active{background:white;color:#12354f}.spacer{flex:1}.shell{max-width:1460px;margin:auto;background:white;min-height:calc(100vh - 62px)}header{height:62px;padding:0 30px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line)}header strong{color:var(--teal);font-size:24px}header span{font-size:14px;color:var(--muted)}nav{padding:18px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:14px}nav button{border:0;padding:4px 8px;color:var(--teal)}main{padding:28px 30px 40px}.notice{background:#f6f7fa;padding:16px 20px;line-height:1.9;font-size:14px}.bar{background:#f6f7fa;padding:16px 14px;font-size:24px;font-weight:bold;margin:28px 0}.field{margin:25px 14px;display:flex;gap:16px;align-items:center}.stepper{display:inline-flex;border:1px solid #d5dce7;border-radius:7px;overflow:hidden}.stepper button{border:0;border-radius:0;padding:8px 14px;font-size:22px}.stepper input{width:100px;border:0;border-inline:1px solid var(--line);text-align:center;outline:none;color:var(--ink)}.error{color:#d84545;font-size:14px;min-height:22px;margin-left:114px}.summary{border-top:1px solid var(--line);margin-top:44px;padding:30px 0;text-align:right;line-height:2.7;font-size:20px}.red{color:#ff565b;font-size:28px}.actions{display:flex;gap:24px;align-items:center;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.actions .primary{font-size:25px;padding:16px 42px}input[type=checkbox]{accent-color:var(--teal);width:19px;height:19px;vertical-align:middle}a,.link{color:var(--teal)}.link{border:0;padding:0;background:none;text-decoration:underline}.success-banner{display:flex;align-items:center;gap:30px;padding:25px;background:#fafbfc}.check{background:#35ae46;color:white;font-size:40px;border-radius:50%;width:72px;height:72px;text-align:center;line-height:72px;flex-shrink:0}.success-banner h2{margin:0 0 12px;font-size:25px;font-weight:500}.success-banner p{margin:0;font-size:14px}.success-banner .total{margin-left:auto;white-space:nowrap;font-size:23px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:20px}.tabs button{width:50%;border:0;border-radius:0;padding:15px;font-size:20px}.tabs .active{color:var(--teal);border-bottom:3px solid var(--teal);font-weight:bold}.paybox{text-align:center;padding:42px 20px}.paybox h2{font-size:30px;font-weight:500;margin:20px 0 65px}.paybox .primary{font-size:27px;padding:14px 66px}.hint{color:var(--muted);font-size:14px;line-height:1.8}.bank{display:grid;grid-template-columns:1fr 1fr;gap:40px;text-align:left;max-width:1050px;margin:0 auto 34px;line-height:2}.balance{background:#eefaf7;padding:18px;margin:0 0 24px}.details{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:25px 0;border:1px solid var(--line)}.details span{font-size:14px;color:var(--muted);display:block;margin-bottom:14px}.center{text-align:center;margin-top:30px}.center button{margin:0 6px;min-width:160px}.filters{display:flex;gap:24px;align-items:center;margin-bottom:25px;flex-wrap:wrap}select{color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 15px;min-width:160px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px;font-size:14px}td,th{padding:22px 14px;border:1px solid var(--line);text-align:center}th{background:#f6f7fa;color:#506177}td button{padding:6px 12px;margin:3px}.orderhead td{text-align:left;background:#fafbfc;font-size:13px}.green{color:#20a44c}.pending{color:#d28b1c}.empty{padding:60px;text-align:center;color:var(--muted)}footer{padding:18px 30px;text-align:center;color:#82909f;font-size:12px;border-top:1px solid #eef0f3}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#18354d;color:white;padding:12px 24px;border-radius:8px;z-index:10}dialog{border:0;border-radius:12px;padding:28px;max-width:540px;width:90%;color:var(--ink);box-shadow:0 15px 70px #102f4b30}dialog::backdrop{background:#132b4666}dialog p{line-height:1.9}dialog button{float:right}.processing{width:50px;height:50px;border:5px solid #d8f1ed;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:35px auto}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){header{padding:0 15px;gap:10px}header span:last-child{display:none}main{padding:18px 15px}.demo{padding:12px 15px}.success-banner{padding:18px;gap:15px;flex-wrap:wrap}.success-banner .total{margin-left:0}.details{grid-template-columns:1fr 1fr;gap:25px}.summary{font-size:17px}.bank{grid-template-columns:1fr;gap:10px}.actions{gap:14px}.actions .primary{width:100%}.notice{font-size:12px}.field{margin-inline:0}nav{padding:15px}.check{width:52px;height:52px;line-height:52px;font-size:30px}}
</style><body><div class="demo"><b>云币充值 · 交互演示</b><button id="wx" onclick="switchPlatform('wx')">企业微信</button><button id="dd" onclick="switchPlatform('dd')">钉钉</button><span>目标方案 · 无真实支付</span><div class="spacer"></div><button onclick="resetDemo()">重置演示</button></div><div class="shell"><header><b id="platformName"></b><span>工作台</span><strong>简道云</strong><div class="spacer"></div><span>示例科技有限公司　｜　管理员</span></header><nav><span>管理后台　›　版本信息　›</span><button onclick="show('form')">云币充值</button><div class="spacer"></div><button onclick="show('orders')">我的订单</button></nav><main id="app"></main><footer>示例数据，仅展示目标操作效果。支付方式、钉钉商品配置及核销时序待确认。刷新页面将恢复初始数据。</footer></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><button onclick="document.getElementById('modal').close()">关闭</button></dialog><div id="toast" class="toast" hidden></div><script>
let platform='wx',view='form',amount=100,agreed=false,method='alipay',currentId=null,filter='all',timer=null,epoch=0;
const initial=()=>({balance:2,orders:[]});let data={wx:initial(),dd:initial()};const $=id=>document.getElementById(id), money=v=>Number(v).toFixed(2), name=()=>platform==='wx'?'企业微信':'钉钉', state=()=>data[platform],order=()=>state().orders.find(o=>o.id===currentId);
function cancelTimer(){clearTimeout(timer);timer=null;epoch++}function switchPlatform(p){cancelTimer();platform=p;amount=100;agreed=false;currentId=null;filter='all';show('form')}function resetDemo(){cancelTimer();data={wx:initial(),dd:initial()};amount=100;agreed=false;currentId=null;show('form');toast('演示已重置')}function show(v){view=v;render()}function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2600)}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}
function agreement(){modal('购买协议 · 演示','<p>本页为产品操作演示，所有订单和余额均为模拟数据，不会产生扣款。本次示例按1元兑换1云币展示。正式购买协议、退款与支付规则以实际产品为准。</p>')}
function render(){$('platformName').textContent=name();$('wx').classList.toggle('active',platform==='wx');$('dd').classList.toggle('active',platform==='dd');$('app').innerHTML=({form:form,pay:pay,processing:processing,success:success,orders:orders})[view]();}
function form(){return `<div class="notice">1. 云币可用于短信、文字识别、附件上传量、工商信息认证等项目的消耗使用。<br>2. 充值可能存在到账延迟，请以订单和余额的实际结果为准。<br>3. 单次充值金额不可小于50，不可大于10000，且必须为整数。</div><div class="bar">充值云币</div><div class="field">当前云币：${money(state().balance)}</div><div class="field">充值金额：<div class="stepper"><button aria-label="减少充值金额" onclick="adjust(-50)">−</button><input id="amount" aria-label="充值金额" value="${amount}" inputmode="numeric" oninput="updateAmount(this.value)"><button aria-label="增加充值金额" onclick="adjust(50)">＋</button></div></div><div id="amountError" class="error" role="alert"></div><div class="field">充值后云币：<span id="after">${money(state().balance+amount)}</span></div><div class="summary">订单总额：<span class="red" id="total">¥${money(amount)}</span><br>企业名称：示例科技有限公司<br>下单人：管理员</div><div class="actions"><label><input type="checkbox" id="agree" ${agreed?'checked':''} onchange="agreed=this.checked"> 我已阅读并同意</label><button class="link" onclick="agreement()">《购买协议》</button><button class="primary" onclick="submit()">确认订单</button></div><div class="hint" style="text-align:right;margin-top:20px">当前在${name()}中充值，云币将计入上述企业。</div>`}
function valid(){return Number.isInteger(amount)&&amount>=50&&amount<=10000}function updateAmount(v){amount=/^\d+$/.test(v)?Number(v):NaN;$('amountError').textContent=valid()?'':'请输入50～10,000之间的整数金额';$('after').textContent=valid()?money(state().balance+amount):'—';$('total').textContent=valid()?'¥'+money(amount):'—'}function adjust(n){amount=Math.max(50,Math.min(10000,(Number.isFinite(amount)?amount:100)+n));$('amount').value=amount;updateAmount(String(amount))}
function submit(){if(!valid()){$('amountError').textContent='请输入50～10,000之间的整数金额';$('amount').focus();return}if(!agreed){toast('请先阅读并同意购买协议');$('agree').focus();return}const o={id:'DEMO-'+(platform==='wx'?'WX':'DD')+'-'+String(state().orders.length+1).padStart(3,'0'),amount,status:'unpaid',time:new Date().toLocaleString('zh-CN'),paid:'—',credited:false};state().orders.unshift(o);currentId=o.id;method='alipay';show('pay')}
function banner(title,o){return `<div class="success-banner"><div class="check">✓</div><div><h2>${title}</h2><p>订单号：${o.id}</p></div><div class="total">支付金额：<span class="red">¥${money(o.amount)}</span></div></div>`}
function pay(){const o=order();if(!o)return '<p>请选择订单</p>';return banner('订单提交成功，请尽快付款',o)+`<div class="bar">付款</div><div class="tabs"><button class="${method==='alipay'?'active':''}" onclick="method='alipay';render()">支付宝</button><button class="${method==='bank'?'active':''}" onclick="method='bank';render()">转账</button></div><div class="paybox"><h2>支付¥${money(o.amount)}</h2>${method==='alipay'?`<button class="primary" onclick="simulatePay()">立即支付</button><p class="hint">点击后模拟付款成功，不会真实扣款。</p>`:`<div class="bank"><div><b>步骤一：对公打款</b><br>收款企业：示例收款方<br>收款账号：演示不提供真实账号<br>转账时请备注订单编号：${o.id}</div><div><b>步骤二：提交凭证</b><br>演示中选择模拟凭证，再模拟审核通过后到账。<br>正式流程以实际支付页面为准。</div></div><button class="primary" onclick="voucher()">提交凭证</button>`}<p class="hint">${name()}支付方式为演示示例，实际可用方式待接入确认。</p><button class="link" onclick="show('orders')">返回我的订单</button></div>`}
function voucher(){modal('提交支付凭证 · 演示','<p>使用系统提供的模拟转账凭证，不上传真实文件。</p><p>订单号：'+order().id+'</p><button class="primary" onclick="submitVoucher()">使用模拟凭证并提交</button>')}
function submitVoucher(){$('modal').close();const o=order();if(o.status!=='unpaid')return;o.status='review';show('orders');toast('凭证已提交，等待审核')}
function simulatePay(){const o=order();if(!o||o.status!=='unpaid')return;o.status='processing';o.paid=new Date().toLocaleString('zh-CN');startCredit(o)}
function approve(id){currentId=id;const o=order();if(o.status!=='review')return;o.status='processing';o.paid=new Date().toLocaleString('zh-CN');startCredit(o)}
function startCredit(o){show('processing');const p=platform,token=epoch;timer=setTimeout(()=>{if(token!==epoch)return;credit(data[p],o);if(p===platform){currentId=o.id;show('success')}},1600)}
function credit(s,o){if(o.credited||o.status==='closed')return;o.credited=true;o.status='success';s.balance+=o.amount}
function processing(){return `<div class="paybox"><div class="processing"></div><h2>付款成功，云币到账处理中</h2><p>请勿重复支付，正在查询订单结果。</p><p class="hint">订单号：${order().id}</p><button onclick="show('orders')">查看订单</button></div>`}
function success(){const o=order();return banner('充值成功，'+o.amount+'云币已到账',o)+`<div class="bar">充值信息</div><div class="details"><div><span>充值金额</span><b class="red">¥${money(o.amount)}</b></div><div><span>到账云币</span>${o.amount}</div><div><span>当前云币</span>${money(state().balance)}</div><div><span>充值企业</span>示例科技有限公司</div></div><div class="center"><button class="primary" onclick="show('orders')">查看订单</button><button onclick="agreed=false;show('form')">继续充值</button></div>`}
const statusNames={unpaid:'未支付',review:'凭证待审核',processing:'到账处理中',success:'已生效',closed:'已取消'};
function orders(){const list=state().orders.filter(o=>filter==='all'||o.status===filter);return `<div class="balance">当前云币：${money(state().balance)}<button style="float:right;padding:2px 14px" onclick="agreed=false;show('form')">充值</button></div><div class="filters"><label>订单状态：<select onchange="filter=this.value;render()">${[['all','全部'],...Object.entries(statusNames)].map(([v,n])=>`<option value="${v}" ${filter===v?'selected':''}>${n}</option>`).join('')}</select></label><span class="hint">当前展示${name()}中的模拟订单</span></div>${list.length?`<div class="tablewrap"><table><thead><tr><th>订单信息</th><th>订单总价</th><th>支付时间</th><th>订单状态</th><th>发票状态</th><th>操作</th></tr></thead><tbody>${list.map(o=>`<tr class="orderhead"><td colspan="6">下单时间：${o.time}　　订单号：${o.id}</td></tr><tr><td>云币充值 × ${o.amount}个</td><td>¥${money(o.amount)}</td><td>${o.paid}</td><td class="${o.status==='success'?'green':'pending'}">${statusNames[o.status]}</td><td>${o.status==='success'?'未开票':'—'}</td><td>${o.status==='unpaid'?`<button onclick="currentId='${o.id}';method='alipay';show('pay')">支付</button><button onclick="cancelOrder('${o.id}')">取消订单</button>`:''}${o.status==='review'?`<button onclick="approve('${o.id}')">模拟审核通过</button>`:''}${o.status==='processing'?`<button onclick="retry('${o.id}')">查询结果</button>`:''}<button onclick="detail('${o.id}')">查看详情</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无符合条件的订单</div>'}`}
function cancelOrder(id){const o=state().orders.find(o=>o.id===id);if(o.status==='unpaid'){o.status='closed';render();toast('订单已取消')}}
function retry(id){const o=state().orders.find(o=>o.id===id);if(o.status==='processing'&&!timer){credit(state(),o);render();toast('云币已到账')}else toast('正在查询，请稍后查看')}
function detail(id){const o=state().orders.find(o=>o.id===id);modal('订单详情',`<p>订单编号：${o.id}<br>所属平台：${name()}<br>充值企业：示例科技有限公司<br>充值金额：¥${money(o.amount)}<br>到账云币：${o.credited?o.amount:'待到账'}<br>订单状态：${statusNames[o.status]}</p>`)}
render();
</script></body></html>
